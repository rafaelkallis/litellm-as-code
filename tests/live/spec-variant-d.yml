# litellm-as-code — variation test spec D (mutation round).
#
# Purpose: permute VALUES of already-existing resources (created by the
# earlier variant specs) to exercise the UPDATE paths:
#   * rename team_alias while keeping team_id fixed (identity preserved)
#   * change user_role (proxy_admin -> internal_user_viewer)
#   * change a user_alias
#   * change team member role (admin -> user)
#   * ADD a team member
#   * flip model costs (per-million) and change base_model
#   * change key allowed_routes
#   * change budget numbers + duration
#   * change policy guardrails_add / description
#   * change credential_info (custom_llm_provider) — comparable field

users:
  - user_id: "var-b-admin"
    user_alias: "var-b-admin-renamed"
    user_email: "var-b-admin@example.com"
    user_role: "internal_user_viewer"
    auto_create_key: "true"

teams:
  - team_id: "var-team-b-fixed"
    team_alias: "var-team-b-renamed"
    max_budget: 99.0
    budget_duration: "14d"
    members_with_roles:
      - user_id: "var-b-admin"
        role: "user"
      - user_id: "var-service"
        role: "user"   # NOTE: team "admin" role is an enterprise-only feature

virtual_keys:
  - key_alias: "var-b-key-teambound"
    team_id: "var-team-b-fixed"
    models: ["var-model-b"]
    allowed_routes: ["/chat/completions", "/embeddings"]

budgets:
  - budget_id: "var-b-budget"
    max_budget: 250.0
    tpm_limit: 1000000
    rpm_limit: 5000
    budget_duration: "15d"

credentials:
  - credential_name: "var-b-cred"
    credential_info:
      custom_llm_provider: "openai"
    credential_values:
      api_base: "https://variant-b.example.com/v1"
      api_key: "sk-var-cred-b"

models:
  - model_name: "var-model-b"
    model_info:
      id: "bbbbbbbb-2222-3333-4444-555555555555"
      mode: "chat"
      base_model: "var-base-b-renamed"
      tier: "paid"
      input_cost_per_million_tokens: 4.0
      output_cost_per_million_tokens: 2.5
    litellm_params:
      model: "hosted_vllm/var-base-b-renamed"
      litellm_credential_name: "var-b-cred"

organizations:
  - organization_id: "org-var-b"
    organization_alias: "var-org-b-renamed"

policies:
  - policy_name: "var-policy-b"
    inherit: "var-policy-a"
    description: "variant B policy UPDATED"
    guardrails_add: ["var-guard-b", "var-guard-a"]
