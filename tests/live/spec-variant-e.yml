# litellm-as-code — variation test spec E (org-free full-field matrix).
#
# Purpose: the version-matrix baseline (scripts/compat_matrix.py). Identical
# to variant C minus the `organizations:` section (LiteLLM >= 1.102 gates the
# whole /organization router behind an Enterprise license on self-hosted
# proxies, so an org-bearing spec can never converge unlicensed there), and
# with the policy's `inherit` reference dropped (variant A owns the parent
# policy and is enterprise-gated as well). Shares variant C's identifiers, so
# if both run against one proxy (licensed stacks) they converge to the same
# managed rows.
#   * users with role+email+alias+auto_create_key
#   * alias-only team with members, key with empty lists, full budget matrix
#   * per-token costs expressed explicitly in model_info (must still
#     converge; on >= 1.102 the cost-only drift is accepted with a message)
#   * guardrail with information + policy with both guardrail lists

users:
  - user_id: "var-c-admin"
    user_alias: "var-c-admin"
    user_email: "var-c-admin@example.com"
    user_role: "proxy_admin"
    auto_create_key: "false"

teams:
  - team_alias: "var-team-c"
    max_budget: 25.0
    budget_duration: "30d"
    members_with_roles:
      - user_id: "var-c-admin"
        role: "user"   # team "admin" is enterprise-only on OSS LiteLLM

virtual_keys:
  - key_alias: "var-c-key"
    key: "sk-var-c-key-44444444444444444444"
    user_id: "var-c-admin"
    models: []
    allowed_routes: []

budgets:
  - budget_id: "var-c-budget"
    max_budget: 50.0
    soft_budget: 40.0
    tpm_limit: 100000
    rpm_limit: 1000
    budget_duration: "30d"

credentials:
  - credential_name: "var-c-cred"
    credential_info:
      custom_llm_provider: "hosted_vllm"
    credential_values:
      api_base: "https://variant-c.example.com/v1"
      api_key: "sk-var-cred-c"

models:
  - model_name: "var-model-c"
    model_info:
      id: "cccccccc-2222-3333-4444-555555555555"
      mode: "completion"
      base_model: "var-base-c"
      tier: "free"
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.000001
    litellm_params:
      model: "hosted_vllm/var-base-c"
      litellm_credential_name: "var-c-cred"

guardrails:
  - guardrail_name: "var-guard-c"
    litellm_params:
      guardrail: "presidio"
      mode: "pre_call"
    guardrail_info:
      description: "variant C guard"

policies:
  - policy_name: "var-policy-c"
    description: "variant E policy (org-free mirroring of variant C)"
    guardrails_add: ["var-guard-c"]
    guardrails_remove: []
