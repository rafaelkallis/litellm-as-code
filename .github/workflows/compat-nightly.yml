# Nightly compat canary (issue #25): one leg pair per day — the floor release
# pin and TODAY'S latest stable LiteLLM — through the same harness the PR/push
# matrix uses (scripts/compat_matrix.py). A red canary means litellm-as-code
# does not yet converge on the current stable generation; it auto-files/
# refreshes exactly ONE 'compat-canary' tracking issue with the run link and
# pytest tails (scripts/compat_canary.py manage), and the next green run
# auto-closes it. Informational — NOT a release gate. The floor pin below is
# bumped by hand, with a re-verification PR (AGENTS.md §9), never by cron.
name: LiteLLM nightly compat canary

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC daily
  workflow_dispatch:
    inputs:
      canary_tag:
        description: "Override the auto-resolved latest-stable tag (e.g. v1.105.0)"
        required: false
        default: ""
      simulate:
        description: "Rehearse the tracking-issue lifecycle without docker"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - red
          - green
      with_fixtures:
        description: "Also record scrubbed response fixtures (issue #28) as run artifacts — adopt into tests/fixtures/ only via a deliberate PR"
        required: false
        default: false
        type: boolean

permissions:
  contents: write # refreshes the committed last-known-good digest (green only)
  issues: write

concurrency:
  group: compat-nightly
  cancel-in-progress: false # a day's probe must never be dropped mid-run

jobs:
  canary:
    name: Floor v1.97.0 vs latest stable
    runs-on: ubuntu-latest
    timeout-minutes: 150 # two legs; the matrix's 45-min/leg budget + pulls
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (editable + dev extras)
        run: pip install -e ".[dev]"

      - name: Resolve canary tag
        id: canary
        if: ${{ inputs.simulate != 'red' && inputs.simulate != 'green' }}
        env:
          GH_TOKEN: ${{ github.token }}
          LITELLM_CANARY_TAG: ${{ inputs.canary_tag }}
        run: |
          tag="$(python scripts/compat_canary.py resolve)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "resolved canary: $tag"

      # docker + the compose plugin are preinstalled on ubuntu-latest runners.
      - name: Run canary legs (floor + latest stable)
        id: leg
        if: ${{ inputs.simulate != 'red' && inputs.simulate != 'green' }}
        continue-on-error: true # the lifecycle step below runs on red too
        run: |
          # Issue #28: with_fixtures (workflow_dispatch only) adds the fixture
          # capture hat — recorded per green leg under reports/nightly-fixtures
          # and uploaded as an artifact below. Scheduled runs default it OFF,
          # so the nightly's verdict/latency behavior is unchanged.
          extra_args=()
          if [ "${{ inputs.with_fixtures }}" = "true" ]; then
            extra_args+=(--record-fixtures reports/nightly-fixtures)
          fi
          python scripts/compat_matrix.py \
            --versions "v1.97.0,${{ steps.canary.outputs.tag }}" \
            --port 4001 \
            --report-out reports/nightly-report.json \
            --digest-out reports/nightly-digest.json \
            "${extra_args[@]}"

      - name: Fabricate rehearsal report (--simulate)
        if: ${{ inputs.simulate == 'red' || inputs.simulate == 'green' }}
        run: |
          python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          # dataclass processing resolves class-module lookups at exec time,
          # so the module MUST be registered before exec_module (see the
          # file-path import recipes in tests/test_compat_matrix.py).
          spec = importlib.util.spec_from_file_location("compat_matrix", "scripts/compat_matrix.py")
          cm = importlib.util.module_from_spec(spec)
          sys.modules["compat_matrix"] = cm
          spec.loader.exec_module(cm)
          pair = cm.parse_versions("v1.97.0,v1.105.0")
          legs = [
              cm.LegResult(version="v1.97.0", green=True, exit_code=0, counts={"passed": 9, "skipped": 4}),
              cm.LegResult(version="v1.105.0", green=True, exit_code=0, counts={"passed": 10, "skipped": 3}),
          ]
          cm.write_report(Path("reports/nightly-report.json"), cm.report_payload(pair, legs, []))
          print("fabricated a green rehearsal report; --simulate decides the lifecycle")
          PY

      # Issue #26: contract-evolution watch. The digest diff is a WATCH
      # signal — exit 2 (drift) must not fail the run; the live suites above
      # decide green/red. The last-known-good digest is refreshed ONLY on a
      # green, drift-free, non-rehearsal run (see the commit step below).
      - name: Diff consumed-surface digest vs last-known-good
        id: digestdiff
        if: ${{ inputs.simulate != 'red' && inputs.simulate != 'green' }}
        run: |
          set +e
          # The harness's --digest-out writes a per-leg DIGEST REPORT
          # (harness='openapi_digest_report', one 'digest' per leg); the diff
          # CLI wants a single RAW digest (the last-known-good shape). Extract
          # the canary leg's digest first — regression-guarded in
          # tests/test_compat_canary.py (run 38404424089 diffed the report
          # itself and verdicted a false drift).
          python - <<'PY'
          import json
          report = json.load(open("reports/nightly-digest.json"))
          legs = report.get("legs", [])
          canary = next((leg for leg in reversed(legs) if "digest" in leg), None)
          if canary is None:
              raise SystemExit(f"no leg captured a digest in the report: report={report.get('harness')!r} legs={len(legs)} — refusing to fake a diff")
          with open("reports/digest-canary.json", "w") as fh:
              json.dump(canary["digest"], fh, sort_keys=True, indent=2)
              fh.write("\n")
          print(f"canary digest extracted: {canary['version']} (spec_version={canary['digest'].get('spec_version')})")
          PY
          code=0
          python scripts/openapi_digest.py diff \
            --old tests/live/compat/openapi-last-known-good.json \
            --new reports/digest-canary.json \
            --text-out reports/contract-drift.txt || code=$?
          if [ "$code" -eq 1 ]; then
            # exit 1 = malformed inputs (unreadable / wrong harness). Fail the
            # step LOUDLY — a format error is not contract drift.
            echo "digest diff hit a format error — failing loudly"
            exit 1
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          all_green="$(python -c 'import json; print(str(json.load(open("reports/nightly-report.json"))["all_green"]).lower())')"
          echo "all_green=$all_green" >> "$GITHUB_OUTPUT"
          echo "digest diff exit: $code (0 identical / 2 drift), report all_green=$all_green"

      - name: Refresh last-known-good digest (green + drift-free only)
        if: >-
          always() &&
          steps.digestdiff.outputs.code == '0' &&
          steps.digestdiff.outputs.all_green == 'true'
        run: |
          mkdir -p tests/live/compat
          # Commit the recovered RAW canary-leg digest (the last-known-good
          # shape) — NOT the whole per-leg report.
          cp reports/digest-canary.json tests/live/compat/openapi-last-known-good.json
          python - <<'PY'
          import datetime, json
          digest = json.load(open("reports/digest-canary.json"))
          meta = {
              "litellm_version": digest.get("spec_version"),
              "captured_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d"),
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "note": "refreshed by the nightly canary on a green, drift-free run (issue #26)",
          }
          with open("tests/live/compat/openapi-last-known-good.meta.json", "w") as fh:
            json.dump(meta, fh, indent=2, sort_keys=True)
            fh.write("\n")
          print("sidecar written:", json.dumps(meta, sort_keys=True))
          PY
          # COMPAT.md's dated verified block derives from THIS sidecar
          # (issue #30) — regenerate it into the same checked-content commit;
          # a no-op (and nothing staged) when the render is already current.
          python scripts/compat_doc.py build
          git config user.name "compat-canary bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/live/compat/openapi-last-known-good.json tests/live/compat/openapi-last-known-good.meta.json COMPAT.md
          git diff --cached --quiet && echo "digest unchanged — nothing to commit" || {
            git commit -m "chore(compat): refresh last-known-good consumed-surface digest [skip ci]"
            git push
          }

      - name: Upload report + digest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-report
          path: |
            reports/nightly-report.json
            reports/nightly-digest.json
            reports/contract-drift.txt
            reports/nightly-fixtures/
          if-no-files-found: warn

      - name: Manage compat-canary tracking issue
        id: lifecycle
        if: always() # green legs matter too: that is the auto-close path
        env:
          GH_TOKEN: ${{ github.token }}
        # NB: inputs.* render as '' on events without inputs, so the -n guard
        # keeps --simulate out of real nightly runs (an empty --simulate arg
        # would die in argparse on schedule).
        run: |
          args=(manage
                --report reports/nightly-report.json
                --label compat-canary)
          args+=("--run-url" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          if [ "${{ inputs.simulate }}" = "red" ] || [ "${{ inputs.simulate }}" = "green" ]; then
            args+=("--simulate" "${{ inputs.simulate }}")
          fi
          if [ -s reports/contract-drift.txt ]; then
            args+=("--digest-diff" reports/contract-drift.txt)
          fi
          python scripts/compat_canary.py "${args[@]}"

      - name: Fail the run on a red canary (scheduled-run heartbeat)
        if: always() && steps.leg.outcome == 'failure'
        run: |
          echo "::error title=canary red::litellm-as-code does not converge on ${{ steps.canary.outputs.tag }} — see the compat-canary tracking issue"
          exit 1
