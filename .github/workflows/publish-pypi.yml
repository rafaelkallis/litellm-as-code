name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (mock-only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (dev extras)
        run: uv sync --extra dev

      - name: Run unit test suite (mock-only)
        run: uv run pytest tests -m 'not integration'

  integration:
    name: Integration tests (live LiteLLM proxy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (dev extras)
        run: uv sync --extra dev

      # Test-owned proxy stack (tests/live/proxy) — never depends on the
      # user-facing examples/docker-compose docs for the CI fixture.
      - name: Start Postgres + LiteLLM proxy (test stack)
        working-directory: tests/live/proxy
        env:
          LITELLM_MASTER_KEY: sk-ci-master-key-0123456789abcdef
          LITELLM_SALT_KEY: sk-ci-salt-key-0123456789abcdef
          # Pin the exact proxy image this release was verified against so
          # re-runs of the same tag stay reproducible (see AGENTS.md §9).
          LITELLM_VERSION: v1.97.0
        run: |
          docker compose up -d postgres litellm
          # first boot runs DB migrations; wait for the healthcheck
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' litellm-as-code-tests-litellm 2>/dev/null || true)
            echo "attempt $i: $status"
            [ "$status" = "healthy" ] && break
            sleep 5
          done
          [ "$status" = "healthy" ] || { docker compose logs litellm; exit 1; }

      - name: Run integration suite (variants + mutation round)
        env:
          LITELLM_BASE_URL: http://localhost:4000
          LITELLM_API_KEY: sk-ci-master-key-0123456789abcdef
        run: uv run pytest tests/live -m 'integration and not slow' -v

      - name: Run slow integration test (documented example spec)
        env:
          LITELLM_BASE_URL: http://localhost:4000
          LITELLM_API_KEY: sk-ci-master-key-0123456789abcdef
        run: uv run pytest tests/live -m slow -v

      - name: Collect proxy logs on failure
        if: failure()
        working-directory: tests/live/proxy
        run: docker compose logs --tail 200 litellm

  publish:
    name: Build & publish sdist/wheel to PyPI
    # Quality gate: BOTH the mock-only unit suite and the live-proxy
    # integration suite must pass before anything is published.
    needs: [test, integration]
    runs-on: ubuntu-latest
    # Trusted publishing: the OIDC token is minted only for the `release`
    # environment (matches the PyPI trusted publisher configuration).
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Manual (workflow_dispatch) runs from a branch intentionally skip this
      # check. Tag-triggered runs must match v<version> from pyproject.toml so
      # a stale/mistyped tag can't publish a mismatched version to PyPI.
      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          echo "tag=$GITHUB_REF_NAME project_version=$project_version"
          if [ "$tag_version" != "$project_version" ]; then
            echo "::error::tag '${GITHUB_REF_NAME}' does not match project version '${project_version}'"
            exit 1
          fi

      - name: Build sdist and wheels
        run: uv build

      # Smoke-test the exact wheel that will be uploaded: catches packaging
      # omissions or a broken console-script entry point that the source
      # checkout tests above would miss.
      - name: Smoke-test built wheel (uvx)
        run: |
          uvx --from ./dist/litellm_as_code-*.whl litellm-as-code --version
          uvx --from ./dist/litellm_as_code-*.whl litellm-as-code --help >/dev/null

      - name: Publish to PyPI
        # check-url makes a retry safe: artifacts already accepted by PyPI are
        # skipped, so only the missing wheel/sdist is uploaded after a partial
        # failure (PyPI rejects re-uploading an existing filename).
        run: uv publish --publish-url https://upload.pypi.org/legacy/ --check-url https://pypi.org/simple/
