# litellm-as-code — Docker Compose example.
#
# A single `docker compose up` brings up a working LiteLLM stack that manages
# the runtime state of a LiteLLM proxy from a declarative spec. The proxy
# upstreams to an **externally hosted, OpenAI-compatible service** (e.g. a
# hosted vLLM, an OpenAI-compatible gateway, etc.) — we do NOT self-host the
# model here.
#
#   postgres -> postgres:16  (DB backing the proxy's runtime state)
#   litellm  -> ghcr.io/berriai/litellm-database   (admin REST API + proxy, port 4000)
#   config   -> ghcr.io/rafaelkallis/litellm-as-code (one-shot reconciler)
#
# The `config` service is intentionally a *run-once* job: it boots after the
# proxy is healthy, reconciles the spec against the live admin API, and exits.
# Re-run it whenever you want to re-check/drift or plan changes:
#
#   docker compose up -d postgres litellm       # start the stack once
#   docker compose run --rm config --dry-run    # plan (exit 2 if a diff exists)
#   docker compose run --rm config              # apply / converge

# Secrets live in `LITELLM_MASTER_KEY` (proxy master key) and in the external
# service's endpoint/key (`OPENAI_COMPATIBLE_BASE_URL` / `OPENAI_COMPATIBLE_API_KEY`).
# To use a `.env` file instead of editing this file, copy `.env.example` to
# `.env` and the `${VAR:-...}` fallbacks below resolve from it.
name: litellm-as-code-example

services:
  postgres:
    image: postgres:16-alpine
    container_name: litellm-as-code-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm}
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litellm} -d ${POSTGRES_DB:-litellm}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm-database:${LITELLM_VERSION:-latest}
    container_name: litellm-as-code-litellm
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env or the shell}"
      LITELLM_SALT_KEY: "${LITELLM_SALT_KEY:-litellm-as-code-demo-salt}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-litellm}@postgres:5432/${POSTGRES_DB:-litellm}"
      STORE_MODEL_IN_DB: "True"
      # The execution database stores users/teams/keys/credentials/models.
      # Startup `config.yaml` settings (general_settings/litellm_settings/
      # router_settings) are NOT reconcilable over the admin API; mount them
      # at /app/config.yaml and the proxy uses them at boot.
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The litellm-database image has no curl/wget; use python's stdlib
      # http client instead.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  config:
    image: ghcr.io/rafaelkallis/litellm-as-code:${AS_CODE_VERSION:-latest}
    container_name: litellm-as-code-config
    # One-shot: reconcile the live proxy to match spec.yml, then exit.
    command: ["spec.yml"]
    environment:
      LITELLM_BASE_URL: "http://litellm:4000"
      LITELLM_API_KEY: "${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env or the shell}"
      LITELLM_SPEC: "/config/spec.yml"
    volumes:
      - ./spec.yml:/config/spec.yml:ro
    depends_on:
      litellm:
        condition: service_healthy
    # `restart: "no"` (default) - this is a run-once job, not a long running server.

volumes:
  postgres-data:
