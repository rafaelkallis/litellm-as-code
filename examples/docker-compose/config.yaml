# LiteLLM proxy startup configuration (bootstrap / boot config).
#
# Scope: this is the proxy's *startup* config.yaml — general_settings /
# litellm_settings / router_settings are applied at boot over the admin REST
# API and are NOT reconciled by litellm-as-code. Runtime-managed resources
# (users/teams/keys/credentials/models/budgets/guardrails/policies) live in
# the DB and are managed from spec.yml.
#
# Environment variables below (LITELLM_MASTER_KEY, DATABASE_URL,
# STORE_MODEL_IN_DB) are set in compose.yml and read by the container.
#
# NOTE: `model_list` is intentionally empty. DB-backed models (created by
# the reconciler from spec.yml) are loaded by the proxy from the database at
# boot, so you don't need to duplicate them here. If you set `store_model_in_db`
# true (as we do in compose.yml), models added via /model/new are available
# without editing this file.

general_settings:
  # Optional: limit log verbosity. Not required.
  # store_model_in_db is set via the STORE_MODEL_IN_DB env var in compose.yml.

  # The proxy binds on 0.0.0.0:4000 by default (see the litellm image CMD).
  # database_url is injected by compose.yml via DATABASE_URL.
  # master_key is injected via LITELLM_MASTER_KEY.

litellm_settings:
  # num_retries / drop_params are optional startup knobs; not required for the demo.
  num_retries: 0
  drop_params: true

router_settings:
  # Optional router-level tuning. Empty for the demo.

model_list: []
