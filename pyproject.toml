[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litellm-as-code"
version = "0.5.0"
description = "Declarative runtime-state management for a LiteLLM proxy: reconcile users/teams/keys/credentials/models from a YAML spec."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rafael Kallis" }]
keywords = ["litellm", "ai-gateway", "declarative", "as-code", "reconciler", "config"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
]

[project.scripts]
litellm-as-code = "litellm_as_code.cli:main"

[tool.setuptools.packages.find]
include = ["litellm_as_code*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Markers for the optional live-proxy integration suite (tests/live).
# The default `pytest tests` run stays mock-only; integration tests are
# collected but skipped unless LITELLM_BASE_URL + LITELLM_API_KEY are set.
markers = [
    "integration: full-stack tests against a real LiteLLM proxy (skipped unless LITELLM_BASE_URL+_API_KEY are set)",
    "slow: slow tests (accidental-optimization guard: run explicitly with -m slow)",
]

# Keep the default unit run fast & hermetic: exclude the live suite unless
# explicitly requested via --integration.
addopts = "-m 'not integration'"
